[project]
name = "swooplib"
version = "0.1.0"
description = "Shared BaseModels for SwoopEngine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swooplib.py"]
